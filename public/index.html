<style>
  /* Panel des agents : thème sobre (gris neutres, un seul accent), inspiré des outils pro (n8n, Linear). Deux thèmes,

  :root {

    --green: #12805c; --green-soft: #e8f6ef; --green-line: #b7e3cc; --green-ink: #085d3a;

    --orange: #b54708; --orange-soft: #fef4e6; --orange-line: #f7d8a8; --orange-ink: #93370d; --warn-dot: #f79009; --purple: #9e77ed;

    --code-bg: #eceef2; --code-area: #fcfcfd; --solid: #101828; --overlay: rgba(16,24,40,.35); --scrim: rgba(16,24,40,.3);
    --boss-bg: #fff7e6; --boss-line: #f5d28f; --boss-ink: #b54708; --boss-stroke: #e0b25e; --code-line: #fbd38d;
    --canvas: #fbfbfc; --canvas-dot: #dfe3ea; --node: #ffffff; --node-line: #d0d5dd; --node-hover: #98a2b3; --link: #b8bfcb; --leaf: #cdd2db;
    --hl-k: #7c3aed; --hl-s: #0f7b4f; --hl-n: #b45309;
    --shadow: 0 1px 2px rgba(16,24,40,.05);

    color-scheme: light;

  :root[data-theme="dark"] {

    --text: #e6edf3; --hint: #9da7b3; --dim: #6e7781; --ink2: #c9d1d9; --ink-bubble: #e6edf3;

    --green: #3fb950; --green-soft: #12261b; --green-line: #1f5133; --green-ink: #7ee2a0;

    --canvas: #0f141a; --canvas-dot: #262c36; --node: #161b22; --node-line: #3d444d; --node-hover: #6e7781; --link: #4b525c; --leaf: #3d444d;

    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
  body { min-height: 100vh; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
  kbd { font: 500 11px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--hint); }

  /* Coque : barre latérale (ordinateur) ou tiroir (téléphone) */
  .shell { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
  aside.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--card2); border-right: 1px solid var(--line); padding: 12px 10px 14px; display: flex; flex-direction: column; gap: 4px; z-index: 30; }
  .brandrow { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; cursor: pointer; }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--solid); display: grid; place-items: center; flex: none; }
  .brand b { display: block; font-size: 14px; font-weight: 600; line-height: 1.2; }
  .brand span { color: var(--dim); font-size: 12px; }
  .searchbtn { display: flex; align-items: center; gap: 8px; width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--dim); border-radius: 6px; padding: 6px 8px; cursor: pointer; text-align: left; font-size: 13px; margin-bottom: 8px; }
  .searchbtn span { flex: 1; } .searchbtn:hover { border-color: var(--line-strong); color: var(--hint); }
  .sec-label { font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; padding: 12px 8px 4px; }
  .navp { margin-top: 2px; }
  .navp > .ptitle, .navlink { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13.5px; font-weight: 500; color: var(--text); cursor: pointer; }
  .navp > .ptitle span:first-of-type { flex: 1; }
  .navp > .ptitle:hover, .navlink:hover { background: var(--hover); }
  .navp > .ptitle.on, .navlink.on { background: var(--active); }
  .nava { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 26px; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--hint); }
  .nava:hover { background: var(--hover); color: var(--text); } .nava.on { background: var(--active); color: var(--text); font-weight: 500; }
  .nava .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nava.off { color: var(--dim); }
  .sidefoot { margin-top: auto; display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  .runner { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--hint); padding: 2px 8px; }
  .topbar { display: none; }
  main.main { min-width: 0; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 28px 110px; }
  @media (max-width: 980px) {
    .shell { grid-template-columns: 1fr; }
    aside.side { position: fixed; left: 0; top: 0; bottom: 0; width: min(86vw, 290px); transform: translateX(-102%); transition: transform .22s var(--ease); box-shadow: var(--shadow-lg); }
    body.menu aside.side { transform: none; }
    body.menu .scrim { display: block; }
    .topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20; padding: 8px 14px; background: var(--card); border-bottom: 1px solid var(--line); font-weight: 600; }
    .wrap { padding: 16px 14px 110px; }
  }
  .scrim { display: none; position: fixed; inset: 0; background: var(--scrim); z-index: 25; }
  .iconbtn { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); display: grid; place-items: center; cursor: pointer; flex: none; }

  h1 { font-size: 22px; font-weight: 600; line-height: 1.25; margin: 0 0 4px; letter-spacing: -.012em; }
  h2 { font-size: 15px; font-weight: 600; margin: 28px 0 10px; }
  .muted { color: var(--hint); } .small { font-size: 13px; } .dim { color: var(--dim); } .mono { font-family: var(--mono); font-size: 12px; }
  .crumbs { font-size: 12.5px; color: var(--dim); margin-bottom: 8px; } .crumbs a { color: var(--hint); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .tap { cursor: pointer; transition: border-color .15s, box-shadow .15s; } .tap:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lg); }
  .row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; } .wrapf { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 4px; font-size: 12px; font-weight: 500; background: var(--sep); color: var(--hint); white-space: nowrap; line-height: 18px; }
  .pill.ok { background: var(--green-soft); color: var(--green); } .pill.ko { background: var(--red-soft); color: var(--red); }
  .pill.warn { background: var(--orange-soft); color: var(--orange); } .pill.acc { background: var(--accent-soft); color: var(--accent-ink); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
  .dot.off { background: var(--dot-off); } .dot.ko { background: var(--red); } .dot.warn { background: var(--warn-dot); }
  .dot.busy { background: var(--accent-2); animation: pulse 1.4s ease-in-out infinite; } .dot.queued { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(11,142,196,.4); } 50% { box-shadow: 0 0 0 5px rgba(11,142,196,0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  /* Chiffres clés : un bandeau découpé, pas des tuiles */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 18px 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .kpi { padding: 12px 16px; border-left: 1px solid var(--sep); }
  .kpi:first-child { border-left: 0; }
  .kpi b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; } .kpi span { color: var(--hint); font-size: 12.5px; }
  .card .kpis { box-shadow: none; margin: 12px 0 0; grid-template-columns: repeat(3, 1fr); }
  .ico { width: 32px; height: 32px; border-radius: 7px; display: grid; place-items: center; background: var(--card2); border: 1px solid var(--line); color: var(--hint); flex: none; }
  .ico svg.i { width: 16px; height: 16px; }
  .ico.lg { width: 44px; height: 44px; border-radius: 9px; } .ico.lg svg.i { width: 22px; height: 22px; }
  .ico.boss { background: var(--boss-bg); border-color: var(--boss-line); color: var(--boss-ink); }
  .icons { display: flex; gap: 6px; color: var(--hint); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 6px; height: 34px; padding: 0 14px; font: 500 13.5px Inter, sans-serif; cursor: pointer;
    background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.08); transition: background .15s, border-color .15s; white-space: nowrap; }
  .btn:hover { background: var(--accent-hover); } .btn:disabled { opacity: .6; cursor: default; }
  .btn.sec { background: var(--card); color: var(--text); border-color: var(--line); } .btn.sec:hover { background: var(--card2); border-color: var(--line-strong); }
  .btn.danger { background: var(--red); color: #fff; } .btn.ghost-danger { background: var(--card); color: var(--red); border-color: var(--line); } .btn.ghost-danger:hover { background: var(--red-soft); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .btn.running { background: var(--accent-2); color: #fff; } .btn.queued { background: var(--accent-soft); color: var(--accent-ink); box-shadow: none; }
  .btn svg.i { width: 14px; height: 14px; }
  /* Onglets soulignés */
  .tabs { display: flex; gap: 2px; overflow-x: auto; margin: 4px 0 18px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .tabs button { border: 0; background: transparent; color: var(--hint); padding: 9px 12px; font: 500 13.5px Inter, sans-serif; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--text); }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--hint); padding: 6px 12px; font: 500 13px Inter, sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { background: var(--card2); color: var(--text); }
  .seg button.on { background: var(--accent-soft); color: var(--accent-ink); }
  .agent { display: flex; flex-direction: column; gap: 10px; }
  .agent .desc { color: var(--hint); font-size: 13px; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin: 0; }
  .meta dt { color: var(--dim); } .meta dd { margin: 0; overflow-wrap: anywhere; }
  .sw { position: relative; width: 34px; height: 20px; flex: none; display: inline-block; } .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: var(--switch-off); border-radius: 999px; transition: .2s; cursor: pointer; }
  .sw span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s var(--ease); box-shadow: 0 1px 2px rgba(16,24,40,.2); }
  .sw input:checked + span { background: var(--accent); } .sw input:checked + span::before { transform: translateX(14px); }
  .list > div { padding: 11px 0; border-top: 1px solid var(--sep); } .list > div:first-child { border-top: 0; padding-top: 0; }
  .note { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--card2); border: 1px solid var(--sep); font-size: 13px; overflow-wrap: anywhere; color: var(--ink2); }
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); margin-bottom: 8px; font-size: 13px; }
  .alert svg.i { margin-top: 2px; }
  .alert.haute { border-color: var(--red-line); background: var(--red-soft); color: var(--red-ink); } .alert.moyenne { border-color: var(--orange-line); background: var(--orange-soft); color: var(--orange-ink); }
  .aclamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; white-space: pre-line; }
  .aclamp.open { display: block; -webkit-line-clamp: unset; }
  .alert.okay { border-color: var(--green-line); background: var(--green-soft); color: var(--green-ink); }
  .alert .vu { border: 0; background: transparent; color: inherit; opacity: .75; font: 500 12.5px Inter, sans-serif; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .alert .vu:hover { opacity: 1; background: rgba(127,127,127,.15); }
  @media (pointer: coarse) { .alert .vu { padding: 6px 8px; } }
  label.f { display: block; margin: 16px 0 6px; font-size: 12.5px; font-weight: 500; color: var(--ink2); }
  input.i, textarea.i { width: 100%; border: 1px solid var(--input-line); border-radius: 6px; padding: 7px 10px; font: inherit; background: var(--card); color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s; box-shadow: var(--shadow); }
  input.i:focus, textarea.i:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  /* Cases à cocher dessinées (02/11 : celles du navigateur juraient avec le thème), sauf les interrupteurs (.sw). */
  input[type="checkbox"]:not(.sw input) { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; flex: none; margin: 1px 0 0; border: 1.5px solid var(--input-line); border-radius: 5px;
    background: var(--card); cursor: pointer; display: inline-grid; place-content: center; transition: background .15s, border-color .15s, box-shadow .15s; }
  input[type="checkbox"]:not(.sw input)::before { content: ""; width: 10px; height: 10px; background: #fff; transform: scale(0); transition: transform .14s var(--ease);
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }
  input[type="checkbox"]:not(.sw input):hover { border-color: var(--accent); }
  input[type="checkbox"]:not(.sw input):checked { background: var(--accent); border-color: var(--accent); }
  input[type="checkbox"]:not(.sw input):checked::before { transform: scale(1); }
  input[type="checkbox"]:not(.sw input):focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
  /* Ligne de choix : toute la ligne se clique, encadrée et teintée quand elle est cochée. */
  .chk { display: flex; align-items: flex-start; gap: 10px; padding: 9px 11px; margin: 6px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    cursor: pointer; font-size: 13.5px; line-height: 1.45; transition: border-color .15s, background .15s; }
  .chk:hover { border-color: var(--line-strong); background: var(--card2); }
  .chk:has(input:checked) { border-color: var(--accent-line); background: var(--accent-soft); }
  .chk b { font-weight: 600; } .chk .d { display: block; color: var(--hint); font-size: 12.5px; margin-top: 1px; }
  /* Sélecteur (menu) à la place d'un <select> natif. */
  .picker { position: relative; display: inline-block; max-width: 100%; }
  .picker > button { display: inline-flex; align-items: center; gap: 9px; min-width: 260px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--input-line); border-radius: 8px;
    background: var(--card); color: var(--text); font: inherit; cursor: pointer; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
  .picker > button:hover { border-color: var(--line-strong); }
  .picker > button:focus-visible, .picker.open > button { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .picker .ico { width: 26px; height: 26px; border-radius: 6px; }
  .picker .nm { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .picker .chev { color: var(--hint); transition: transform .18s var(--ease); }
  .picker.open .chev { transform: rotate(180deg); }
  .picker .menu { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; min-width: 100%; max-height: 320px; overflow: auto; padding: 4px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); display: none; animation: pop .12s var(--ease); }
  .picker.open .menu { display: block; }
  .picker .menu button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px; border: 0; border-radius: 6px; background: transparent; color: var(--text);
    font: inherit; text-align: left; cursor: pointer; }
  .picker .menu button:hover, .picker .menu button:focus-visible { background: var(--hover); outline: none; }
  .picker .menu button.on { background: var(--accent-soft); color: var(--accent-ink); }
  .picker .menu .sub { margin-left: auto; padding-left: 12px; color: var(--dim); font-size: 12px; white-space: nowrap; }
  .picker .menu .tick { color: var(--accent); }

  /* Carte mentale : canevas à points, patron en haut, sous-agents reliés */

  /* Canevas façon n8n : fond à points, zoom et déplacement, agents en cartes, liens courbes, mini-carte, panneau */
  .cv { position: relative; padding: 0; overflow: hidden; height: calc(100vh - 330px); min-height: 460px; background-color: var(--canvas); background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px); background-size: 20px 20px; }

  .cnode { cursor: pointer; } .cnode .box { fill: var(--node); stroke: var(--node-line); stroke-width: 1.3; filter: drop-shadow(0 2px 4px rgba(0,0,0,.12)); transition: stroke .15s; }

  .cnode.off .box { fill: var(--card2); stroke-dasharray: 5 4; } .cnode.off .cvt { fill: var(--dim); }

  .cnode.boss .box { stroke: var(--boss-stroke); } .cnode.boss .tile { fill: var(--boss-bg); stroke: var(--boss-line); } .cnode.boss .glyph { stroke: var(--boss-ink); }
  .cnode .tile { fill: var(--card2); stroke: var(--line); } .cnode .glyph { stroke: var(--hint); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Changements du code (diff) */

  /* Conversations avec l'agent patron, comme sur Claude : liste des conversations à gauche, messages, réponse en direct.

const norm = (s) => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

  const draw = () => {

    shown = items.filter((it) => q.every((w) => norm(it.label + " " + it.sub).includes(w))).slice(0, 40);
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    res.innerHTML = shown.length ? shown.map((it, i) => '<div class="it' + (i === sel ? " on" : "") + '" data-i="' + i + '">' + ic(it.icon) + "<span>" + esc(it.label) + '</span><span class="k">' + esc(it.sub) + "</span></div>").join("") : '<div class="empty small">Rien trouvé.</div>';
  };

// Exécutions en tableau (comme une liste d'exécutions de workflow).

// Agents en tableau : nom, horaire, dernière et prochaine exécution, interrupteur, lancement.

// ---------- projet ----------
// La carte (mapping visuel des agents, données et fichiers) est la vue d'ouverture d'un projet (demande du propriétaire).
const TABS = [["carte", "Carte"], ["agents", "Agents"], ["fil", "Fil des agents"], ["activite", "Exécutions"], ["chronologie", "Chronologie"], ["decouvertes", "Découvertes"], ["strategies", "Stratégies"], ["changements", "Changements"], ["reglages", "Réglages"]];
// Pour commencer (parcours du 02/11) : un projet neuf n'a que le patron et l'éclaireur, en pause, et rien ne disait
// quoi faire ensuite. Agents utiles partout, ajoutés et lancés en un clic (un agent qui modifie le code demande confirmation).
const QUICK = ["securite", "tests"];
function quickStart(pid, tpls) {
  const btn = (x) => '<div class="card tap" ' + a(async (el) => {
    if (el.dataset.busy) return; el.dataset.busy = "1";
    try {
      const r = await call("/api/projects/" + pid + "/agents", { template: x.id });
      await runAgent(pid, r.agent); pollNav(); go("#/p/" + pid + "/a/" + r.agent.id);
    } catch (e) { toast(e.message, "err"); delete el.dataset.busy; }
  }) + '><div class="row"><span class="ico">' + ic(TPL_IC[x.id] || "bot") + "</span><b>" + esc(x.name) + '</b><span class="grow"></span><span class="pill acc">Ajouter</span></div><div class="small muted" style="margin-top:6px">' + esc(x.description) + "</div></div>";
  return '<div class="card" style="margin-bottom:14px"><b>Pour commencer</b><div class="small muted" style="margin:4px 0 10px">Ajoute un agent en un clic : il fait son premier passage tout de suite, puis tourne tout seul. Tu pourras tout régler ensuite. Tu peux aussi poser tes questions au patron (« Parler au patron »).</div>' +
    '<div class="tpl">' + tpls.filter((x) => QUICK.includes(x.id)).map(btn).join("") +
    '<div class="card tap" ' + a(() => go("#/p/" + pid + "/new")) + '><div class="row"><span class="ico">' + ic("plus") + "</span><b>Un autre agent</b></div><div class=\"small muted\" style=\"margin-top:6px\">D'autres modèles, ou un agent à ta façon : tu écris en une phrase ce qu'il doit faire.</div></div></div></div>";
}
// Chemin long (dossier d'un ordinateur) : le disque et les deux derniers dossiers, le chemin entier au survol.
const shortPath = (d) => { const s = String(d || "").replace(/\\/g, "/"), parts = s.split("/").filter(Boolean); return parts.length > 4 ? parts[0] + "/…/" + parts.slice(-2).join("/") : s; };

    '<div class="row"><button class="btn sec" ' + a(() => go("#/p/" + id + "/chat")) + ">" + ic("chat") + "Parler au patron</button>" +

  if (tab === "agents") html += agentsTable(id, d.agents) + '<div id="removed"></div>';
  if (tab === "reglages") html += settingsView(p);
  if (tab === "fil") html += '<div class="help" style="margin:-6px 0 10px">Ce que les agents de ce projet se disent. À la fin de son passage, un agent peut écrire à un autre : le message lui est remis au début de son passage suivant, et il est lancé tout de suite s\'il est actif (un agent en pause le lit à son prochain passage).</div><div id="fil"><div class="skel"></div></div>';

// Supprimer le projet (03/11) : nom à recopier ; le code du projet n'est jamais touché.
async function deleteProject(p) {
  const where = p.node ? " Sur l'ordinateur « " + esc(p.node.name) + " », ses agents s'arrêtent et leur dossier est effacé" + (p.node.online ? "." : " à sa prochaine connexion.") : "";
  const v = await modal({ title: "Supprimer « " + p.name + " » ?", body: "Le projet disparaît du panel avec ses agents (dossier <span class=\"mono\">agents-ia</span> : consignes et résultats), l'historique des passages, les conversations avec le patron et les connexions." + where +
    (p.dataKept ? " Les résultats rangés dans <span class=\"mono\">" + esc(p.dataKept) + "</span> restent dans le projet." : "") + " <b>Le code du projet n'est pas touché.</b><br><br>Écris <b>" + esc(p.name) + "</b> pour confirmer.",
    input: { placeholder: p.name, rows: 1, min: 1 }, ok: "Supprimer le projet", danger: true });
  if (v === null) return;
  if (v.trim().toLowerCase() !== p.name.trim().toLowerCase()) return toast("Nom différent : le projet est gardé.", "err");
  try {
    await call("/api/projects/" + p.id + "/delete", { name: v });
    toast("Projet « " + p.name + " » supprimé", "ok"); pollNav(); go("#/");
  } catch (e) { toast(e.message, "err"); }
}

async function saveSettings(p, btn) {
  const body = {};

  try {
    const r = await call("/api/projects/" + p.id + "/settings", body);
    toast(r.changed.length ? "Réglages enregistrés : " + r.changed.join(", ") + (p.node ? " (l'ordinateur les reçoit à sa prochaine connexion)" : "") : "Rien n'a changé", "ok");
    if (r.changed.length) { pollNav(); render(); }
  } catch (e) { toast(e.message, "err"); } finally { btn.disabled = false; }
}

// Agents supprimés (historique du panel) : restaurés en un clic, en pause. Gardés une minute (l'onglet se rafraîchit seul).

    '<div class="card list" style="margin-top:8px">' + c.list.map((x) => '<div class="row between wrapf" style="gap:10px;padding:10px 0"><div class="row grow" style="gap:10px;min-width:0"><span class="ico' + (x.kind === "supervisor" ? " boss" : "") + '">' + agIc(x.kind) + '</span><div style="min-width:0"><b>' + esc(x.name) + "</b>" +

        catch (e) { toast(e.message, "err"); el.disabled = false; }

// ---------- changements du code (diff) et annulation ----------
async function commitClick(pid, e) {
  const b = e.target.closest("[data-k]");
  if (!b) return;
  const row = b.closest(".cmt"), hash = row.dataset.h, box = row.querySelector(".diffbox");
  if (b.dataset.k === "voir") {
    if (box.innerHTML) { box.innerHTML = ""; b.innerHTML = ic("file") + "Voir le changement"; return; }
    box.innerHTML = '<div class="skel" style="height:80px;margin-top:10px"></div>';
    try { const c = await call("/api/projects/" + pid + "/commits/" + hash); box.innerHTML = diffHtml(c); b.innerHTML = ic("x") + "Fermer"; }
    catch (x) { box.innerHTML = '<div class="note">' + esc(x.message) + "</div>"; }
    return;
  }
  if (b.dataset.k === "annuler") {
    if (!(await modal({ title: "Annuler ce changement ?", body: "Le runner défait ce commit au prochain passage (moins d'une minute s'il est libre), lance les tests, puis commite et redémarre le projet. Si un test échoue, rien ne change. Le résultat arrive dans les notifications du patron.", ok: "Annuler le changement", danger: true }))) return;
    try { await call("/api/projects/" + pid + "/commits/" + hash + "/revert", {}); toast("Annulation en file : résultat dans les notifications", "ok", ["Voir", "#/p/" + pid + "/chat/notifs"]); b.disabled = true; b.textContent = "Annulation en file…"; pollNav(); }
    catch (x) { toast(x.message, "err"); }
  }
}
function diffHtml(c) {
  const line = (l) => '<div class="dl ' + (l[0] === "+" ? "add" : l[0] === "-" ? "del" : l.startsWith("@@") ? "hunk" : "") + '">' + esc(l || " ") + "</div>";
  const add = c.files.reduce((s, f) => s + f.add, 0), del = c.files.reduce((s, f) => s + f.del, 0);
  return '<div class="diff"><div class="row between wrapf" style="gap:8px;margin:10px 0 8px"><div class="small muted">' + c.files.length + " fichier" + (c.files.length > 1 ? "s" : "") + ' · <span class="dadd">+' + add + '</span> <span class="ddel">−' + del + "</span> · " + esc(c.author) + " · " + when(c.at) + "</div>" +
    (c.reverted ? '<span class="pill">déjà annulé</span>' : '<button class="btn ghost-danger sm" data-k="annuler">' + ic("redo") + "Annuler ce changement</button>") + "</div>" +
    (c.body ? '<div class="note" style="margin:0 0 8px;white-space:pre-wrap">' + esc(c.body.replace(/\n*Co-Authored-By:[^\n]*/gi, "").trim()) + "</div>" : "") +
    c.files.map((f) => '<details class="dfile"' + (f.lines.length < 400 ? " open" : "") + '><summary><span class="mono">' + esc(f.file) + "</span>" + (f.status ? ' <span class="pill">' + f.status + "</span>" : "") + ' <span class="dadd">+' + f.add + '</span> <span class="ddel">−' + f.del + "</span></summary>" +
      (f.binary ? '<div class="dl">Fichier binaire</div>' : '<div class="dcode">' + f.lines.map(line).join("") + (f.cut ? '<div class="dl hunk">… coupé (trop long)</div>' : "") + "</div>") + "</details>").join("") + "</div>";
}

// ---------- chronologie des passages ----------
// Une ligne par agent, une barre par passage (de son début à sa fin), couleur selon le résultat ; le passage en cours
// grandit en direct. Fins de semaine grisées (or fermé), ligne « maintenant ». Clic sur une barre : l'agent.
let tlDays = (() => { try { return Number(localStorage.getItem("agTlDays")) || 1; } catch (e) { return 1; } })();
const TL_COLOR = { ok: "var(--green)", rien: "var(--dot-off)", erreur: "var(--red)", attention: "var(--warn-dot)", "reporté": "var(--warn-dot)", limite: "var(--warn-dot)" };
async function drawTimeline(pid) {
  const box = $("#tl");
  if (!box) return;
  const d = await call("/api/projects/" + pid + "/timeline?days=" + tlDays);
  const from = Date.parse(d.from), to = Date.parse(d.to), span = to - from;
  const x = (t) => Math.max(0, Math.min(100, ((t - from) / span) * 100));
  const lanes = d.agents.map((a) => ({ ...a, runs: d.runs.filter((r) => r.agent === a.id) }));
  // Graduations : toutes les 3 h sur 24 h, chaque jour sur 7 jours (heure de l'appareil).
  const step = tlDays === 1 ? 3 * 3600e3 : 86400e3, ticks = [];
  const t0 = new Date(from); t0.setMinutes(0, 0, 0); if (tlDays > 1) t0.setHours(0); else t0.setHours(Math.ceil(t0.getHours() / 3) * 3);
  for (let t = t0.getTime(); t <= to; t += step) if (t >= from) ticks.push(t);
  const weekend = [];
  for (let t = new Date(from).setUTCHours(0, 0, 0, 0); t < to; t += 86400e3) { const g = new Date(t).getUTCDay(); if (g === 6 || g === 0) weekend.push([x(t), x(t + 86400e3)]); }
  const lbl = (t) => new Date(t).toLocaleString("fr-FR", tlDays === 1 ? { hour: "2-digit", minute: "2-digit" } : { weekday: "short", day: "2-digit" });
  const total = (runs) => mins(Math.round(runs.reduce((s, r) => s + (r.seconds || 0), 0) / 60));
  const bar = (r, a) => {
    const end = Date.parse(r.at), start = end - (r.seconds || 0) * 1000;
    return '<a class="tlbar" href="#/p/' + pid + "/a/" + a.id + '" style="left:' + x(start) + "%;width:" + Math.max(0, x(end) - x(start)) + "%;background:" + (TL_COLOR[r.status] || "var(--accent)") + '" title="' +
      esc(a.name + " · " + when(r.at) + " · " + dur((r.seconds || 0) * 1000) + " · " + ((STATUS[r.status] || ["", r.status])[1]) + (r.source ? " · " + r.source : "") + (r.commit ? " · commit " + r.commit : "") + (r.summary ? "\n" + r.summary.slice(0, 220) : "")) + '"></a>';
  };
  const cur = d.current && Date.parse(d.current.since);
  box.innerHTML = '<div class="row between wrapf" style="margin-bottom:10px;gap:10px"><div class="seg">' + [[1, "24 heures"], [7, "7 jours"]].map(([n, l]) => '<button class="' + (tlDays === n ? "on" : "") + '" data-tl="' + n + '">' + l + "</button>").join("") + "</div>" +
    '<div class="legend"><span><i style="border-color:var(--green)"></i>ok</span><span><i style="border-color:var(--warn-dot)"></i>à voir</span><span><i style="border-color:var(--red)"></i>erreur</span><span><i style="border-color:var(--dot-off)"></i>rien à faire</span><span><i style="border-color:var(--accent-2)"></i>en cours</span></div></div>' +
    '<div class="card tl"><div class="tlrow tlhead"><div class="tlname"></div><div class="tltrack">' + ticks.map((t) => '<span class="tltick" style="left:' + x(t) + '%">' + lbl(t) + "</span>").join("") + '</div><div class="tlsum">travail</div></div>' +
    lanes.map((a) => '<div class="tlrow"><div class="tlname' + (a.enabled ? "" : " off") + '"><span class="ico' + (a.kind === "supervisor" ? " boss" : "") + '" style="width:24px;height:24px;border-radius:6px">' + agIc(a.kind) + '</span><a href="#/p/' + pid + "/a/" + a.id + '">' + esc(a.name) + "</a></div>" +
      '<div class="tltrack">' + weekend.map(([l, r]) => '<span class="tlwe" style="left:' + l + "%;width:" + (r - l) + '%"></span>').join("") + ticks.map((t) => '<span class="tlgrid" style="left:' + x(t) + '%"></span>').join("") +
      a.runs.map((r) => bar(r, a)).join("") + (cur && d.current.agent === a.id ? '<span class="tlbar live" style="left:' + x(cur) + "%;width:" + Math.max(0.3, 100 - x(cur)) + '%" title="' + esc(a.name + " · en cours depuis " + dur(Date.now() - cur)) + '"></span>' : "") +
      '<span class="tlnow"></span></div><div class="tlsum">' + a.runs.length + " · " + total(a.runs) + "</div></div>").join("") + "</div>" +
    '<div class="help" style="margin-top:8px">Une barre par passage, de son début à sa fin. Fins de semaine grisées (or fermé). Survole une barre pour le détail, clique pour ouvrir l\'agent.</div>';
  box.querySelectorAll("[data-tl]").forEach((b) => b.addEventListener("click", () => { tlDays = Number(b.dataset.tl); try { localStorage.setItem("agTlDays", tlDays); } catch (e) { /* sans stockage */ } drawTimeline(pid); }));
}

// ---------- canevas façon n8n ----------
// Patron à gauche, agents en colonne, liens courbes (supervise, alimente, déclenche) ; « Données » ajoute ce que les
// agents lisent (à gauche) et produisent (à droite). Glisser le fond : déplacer ; molette ou pincement : zoom ;
// glisser un agent : le placer (gardé sur l'appareil) ; clic : panneau de l'agent (lancer, pause, ouvrir). Mini-carte en
// bas à droite. Un agent qui tourne pulse et ses liens s'animent, en direct (canvasLive, appelé par pollNav).
const CV = { pid: null, g: null, nodes: [], edges: [], view: { x: 40, y: 40, k: 1 }, pos: {}, data: false, sel: null };
const trunc = (s, n) => (String(s || "").length > n ? String(s).slice(0, n - 1) + "…" : String(s || ""));
const cvKey = (pid) => "agCanvas:" + pid;
function cvLoad(pid) { try { return JSON.parse(localStorage.getItem(cvKey(pid)) || "{}"); } catch (e) { return {}; } }
function cvSave() { try { localStorage.setItem(cvKey(CV.pid), JSON.stringify({ pos: CV.pos, view: CV.view, data: CV.data })); } catch (e) { /* sans stockage */ } }
function cvLayout() {
  const g = CV.g, { bossId, links } = agentLinks(g);
  const agents = g.nodes.filter((n) => n.type === "agent" && n.id !== bossId);
  const AW = 236, AH = 64, DW = 200, DH = 40, GAP = 88;
  const nodes = [];
  // Plus de 5 agents : deux colonnes (une seule serait trop haute pour rester lisible une fois ajustée à l'écran).
  const cols = agents.length > 5 ? 2 : 1, rows = Math.ceil(agents.length / cols), colH = rows * GAP;
  const boss = bossId && g.nodes.find((n) => n.id === bossId);
  if (boss) nodes.push({ ...boss, w: AW + 20, h: AH + 10, x: 0, y: colH / 2 - (AH + 10) / 2 - GAP / 4, boss: true });
  agents.forEach((n, i) => nodes.push({ ...n, w: AW, h: AH, x: 380 + Math.floor(i / rows) * 330, y: (i % rows) * GAP }));
  const outX = 380 + cols * 330 + 40;
  const edges = [];
  if (boss) agents.forEach((n) => edges.push({ from: boss.id, to: n.id, type: "sup" }));
  for (const l of links) edges.push({ from: l.from, to: l.to, type: l.type, label: l.label, side: true });
  if (CV.data) {
    const src = g.nodes.filter((n) => n.type === "source"), out = g.nodes.filter((n) => n.type === "output");
    src.forEach((n, i) => nodes.push({ ...n, w: DW, h: DH, x: -20, y: colH / 2 + 80 + i * 56, data: true }));
    out.forEach((n, i) => nodes.push({ ...n, w: DW, h: DH, x: outX, y: i * 56, data: true }));
    for (const e of g.edges) if ((e.type === "reads" || e.type === "writes") && nodes.some((n) => n.id === e.from) && nodes.some((n) => n.id === e.to)) edges.push({ from: e.from, to: e.to, type: "data" });
  }
  for (const n of nodes) if (CV.pos[n.id]) [n.x, n.y] = CV.pos[n.id];
  CV.nodes = nodes; CV.edges = edges;
}
function cvPath(e) {
  const a = CV.nodes.find((n) => n.id === e.from), b = CV.nodes.find((n) => n.id === e.to);
  if (!a || !b) return null;
  if (e.side && Math.abs(a.x - b.x) < 60) { // deux agents de la même colonne : boucle par la droite
    const x = a.x + a.w, y1 = a.y + a.h / 2, y2 = b.y + b.h / 2, bulge = 60 + Math.min(120, Math.abs(y2 - y1) / 4);
    return { d: "M" + x + "," + y1 + " C" + (x + bulge) + "," + y1 + " " + (x + bulge) + "," + y2 + " " + x + "," + y2, mx: x + bulge * 0.75, my: (y1 + y2) / 2 };
  }
  const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, dx = Math.max(60, Math.abs(x2 - x1) / 2);
  return { d: "M" + x1 + "," + y1 + " C" + (x1 + dx) + "," + y1 + " " + (x2 - dx) + "," + y2 + " " + x2 + "," + y2, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
}
function cvNodeHtml(n) {
  const st = n.agent ? agentState(CV.pid, n.agent) : null;
  const kind = n.agent ? kindOf(CV.pid, n.agent) : null;
  const sub = n.data ? (n.type === "source" ? "donnée lue" : "fichier produit") : st ? (st.running ? "en cours · " + dur(Date.now() - Date.parse(st.since)) : "en file") : !n.enabled ? "en pause" : n.last ? "dernier passage " + ago(n.last) : "jamais lancé";
  const dot = n.data ? "" : '<circle cx="' + (n.w - 14) + '" cy="14" r="5" class="cvdot ' + (st ? (st.running ? "busy" : "queued") : statusDot(n.status, n.enabled)) + '"/>';
  return '<g class="cnode' + (n.boss ? " boss" : "") + (n.data ? " data" : "") + (n.agent && !n.enabled ? " off" : "") + (st && st.running ? " busy" : "") + (CV.sel === n.id ? " sel" : "") + '" data-n="' + esc(n.id) + '" transform="translate(' + n.x + "," + n.y + ')">' +
    '<rect class="box" width="' + n.w + '" height="' + n.h + '" rx="10"/>' +
    (n.data ? '<text x="14" y="17" class="cvt">' + esc(trunc(n.label, 24)) + '</text><text x="14" y="31" class="cvs">' + sub + "</text>"
      : '<rect class="tile" x="12" y="' + (n.h / 2 - 16) + '" width="32" height="32" rx="8"/><g class="glyph" transform="translate(16,' + (n.h / 2 - 12) + ')">' + (IC[KIND_IC[kind] || "bot"]) + "</g>" +
        '<text x="54" y="' + (n.h / 2 - 3) + '" class="cvt">' + esc(trunc(n.label, 22)) + '</text><text x="54" y="' + (n.h / 2 + 14) + '" class="cvs">' + esc(trunc(sub, 30)) + "</text>" + dot) +
    '<circle class="hdl" cx="0" cy="' + n.h / 2 + '" r="4"/><circle class="hdl" cx="' + n.w + '" cy="' + n.h / 2 + '" r="4"/></g>';
}
function cvDraw() {
  const svg = $("#cvsvg");
  if (!svg) return;
  const running = (id) => { const n = CV.nodes.find((x) => x.id === id); const st = n && n.agent && agentState(CV.pid, n.agent); return !!(st && st.running); };
  const edges = CV.edges.map((e) => { const p = cvPath(e); if (!p) return ""; const live = running(e.from) || running(e.to);
    return '<path class="cve ' + e.type + (live ? " flow" : "") + '" d="' + p.d + '" marker-end="url(#cvar-' + (e.type === "sup" ? "sup" : e.type === "data" ? "data" : e.type) + ')"/>' +
      (e.label && e.type !== "sup" ? '<text class="cvl" x="' + p.mx + '" y="' + (p.my - 4) + '">' + esc(trunc(e.label, 26)) + "</text>" : ""); }).join("");
  $("#cvvp").innerHTML = edges + CV.nodes.map(cvNodeHtml).join("");
  $("#cvvp").setAttribute("transform", "translate(" + CV.view.x + "," + CV.view.y + ") scale(" + CV.view.k + ")");
  cvMini();
}
function cvBox() { const xs = CV.nodes.flatMap((n) => [n.x, n.x + n.w]), ys = CV.nodes.flatMap((n) => [n.y, n.y + n.h]); return { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys) }; }
function cvFit() {
  const el = $("#cvsvg"), b = cvBox(), W = el.clientWidth, H = el.clientHeight, pad = 50;
  const k = Math.min(1.25, Math.max(0.3, Math.min((W - pad * 2) / (b.x1 - b.x0 + 120), (H - pad * 2) / (b.y1 - b.y0))));
  CV.view = { k, x: (W - (b.x1 - b.x0 + 120) * k) / 2 - b.x0 * k, y: (H - (b.y1 - b.y0) * k) / 2 - b.y0 * k };
  cvDraw(); cvSave();
}
function cvMini() {
  const m = $("#cvmini");
  if (!m || !CV.nodes.length) return;
  const b = cvBox(), el = $("#cvsvg"), MW = 180, MH = 110, pad = 20;
  const s = Math.min((MW - 8) / (b.x1 - b.x0 + pad * 2), (MH - 8) / (b.y1 - b.y0 + pad * 2)), ox = b.x0 - pad, oy = b.y0 - pad;
  // Cadre de la vue, ramené dans la mini-carte (la vue peut être plus grande que le contenu).
  let vx = (-CV.view.x / CV.view.k - ox) * s, vy = (-CV.view.y / CV.view.k - oy) * s, vw = (el.clientWidth / CV.view.k) * s, vh = (el.clientHeight / CV.view.k) * s;
  const cx0 = Math.max(0, vx), cy0 = Math.max(0, vy); vw = Math.max(6, Math.min(MW - 8, vx + vw) - cx0); vh = Math.max(6, Math.min(MH - 8, vy + vh) - cy0); vx = cx0; vy = cy0;
  m.innerHTML = '<svg width="' + MW + '" height="' + MH + '">' + CV.nodes.map((n) => '<rect x="' + ((n.x - ox) * s + 4) + '" y="' + ((n.y - oy) * s + 4) + '" width="' + n.w * s + '" height="' + n.h * s + '" rx="2" class="' + (n.boss ? "mb" : n.data ? "md" : "ma") + '"/>').join("") +
    '<rect class="mv" x="' + (vx + 4) + '" y="' + (vy + 4) + '" width="' + vw + '" height="' + vh + '"/></svg>';
  m.onclick = (e) => { const r = m.getBoundingClientRect(); const wx = (e.clientX - r.left - 4) / s + ox, wy = (e.clientY - r.top - 4) / s + oy; CV.view.x = el.clientWidth / 2 - wx * CV.view.k; CV.view.y = el.clientHeight / 2 - wy * CV.view.k; cvDraw(); cvSave(); };
}
// Panneau de l'agent sélectionné.
function cvPanel() {
  const box = $("#cvpanel");
  const n = CV.nodes.find((x) => x.id === CV.sel);
  if (!n) { box.hidden = true; return; }
  box.hidden = false;
  const ag = n.agent && agentOf(CV.pid, n.agent);
  const st = n.agent && agentState(CV.pid, n.agent);

// Heure UTC -> heure de Paris (aujourd'hui, heure d'été ou d'hiver comprise)
const paris = (h) => { const d = new Date(); d.setUTCHours(Number(h) || 0, 0, 0, 0); return d.toLocaleTimeString("fr-FR", { timeZone: "Europe/Paris", hour: "2-digit", minute: "2-digit" }); };

const parisOff = () => Number(paris(0).slice(0, 2));
const toParis = (hUTC, wdUTC) => { const h = (Number(hUTC) || 0) + parisOff(); return { h: h % 24, d: ((Number(wdUTC) || 0) + (h >= 24 ? 1 : 0)) % 7 }; };

  if (s.type === "weekly") {

    h += '<div class="two"><div><label class="f">Jour</label><div class="seg">' + DAYS.map((d, i) => '<button type="button" class="' + (s.dayParis === i ? "on" : "") + '" ' + a((el) => { form.schedule.dayParis = i; el.parentNode.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el)); markDirty(); }) + ">" + d + "</button>").join("") + "</div></div>" + n("hourParis", tp.h, "Heure (heure de Paris)", 0, 23) + "</div>";

// Coloration simple du code (commentaires, chaînes, nombres, mots-clés) : texte brut -> HTML échappé.
const KW = /\b(const|let|var|function|return|if|else|for|while|of|in|new|async|await|try|catch|throw|class|import|from|export|require|module|exports|true|false|null|undefined|def|self|None|True|False|elif|lambda|with|as|pass|raise|except|switch|case|break|continue|typeof|SELECT|FROM|WHERE|AND|OR|ORDER|BY|LIMIT)\b/g;
function hl(code) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|(?:^|\s)#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)/g;
  const kw = (s) => esc(s).replace(KW, '<span class="hk">$1</span>');
  let out = "", last = 0, m;
  while ((m = re.exec(code))) { out += kw(code.slice(last, m.index)) + '<span class="' + (m[1] ? "hc" : m[2] ? "hs" : "hn") + '">' + esc(m[0]) + "</span>"; last = re.lastIndex; }
  return out + kw(code.slice(last));
}
// Mise en forme des réponses : paragraphes, listes, tableaux, **gras**, `code`, blocs de code colorés (bouton Copier), liens.
function md(src) {
  const blocks = [];
  const keep = (html) => "\u0000" + (blocks.push(html) - 1) + "\u0000";
  const t = esc(String(src || "").replace(/```([\w+-]*)[^\n]*\n?([\s\S]*?)(?:```|$)/g, (_, lang, code) =>
    keep('<pre class="code"><div class="cbar"><span>' + esc(lang || "code") + '</span><button type="button" class="ccopy">Copier</button></div><code>' + hl(code.replace(/\n$/, "")) + "</code></pre>")));
  const inline = (s) => s.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
  return t.split(/\n{2,}/).map((para) => {
    let html = "", list = null;
    const text = [], lines = para.split("\n");
    const flushList = () => { if (list) { html += "<" + list.tag + ">" + list.items.map((x) => "<li>" + inline(x) + "</li>").join("") + "</" + list.tag + ">"; list = null; } };
    const flushText = () => { if (text.length) { html += "<p>" + text.map(inline).join("<br>") + "</p>"; text.length = 0; } };
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (/^\s*\|/.test(l) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || "")) {
        flushList(); flushText();
        const head = cells(l), rows = [];
        for (i += 2; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(cells(lines[i]));
        i--;
        html += '<div class="tw"><table class="mdt"><thead><tr>' + head.map((c) => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" + rows.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
        continue;
      }
      const m = /^\s*([-*•]|\d+[.)])\s+(.*)$/.exec(l);
      if (m) { flushText(); const tag = /\d/.test(m[1]) ? "ol" : "ul"; if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; } list.items.push(m[2]); }
      else if (/^\u0000\d+\u0000$/.test(l.trim())) { flushList(); flushText(); html += l.trim(); }
      else if (/^#{1,4}\s+/.test(l)) { flushList(); flushText(); html += "<p><b>" + inline(l.replace(/^#+\s+/, "")) + "</b></p>"; }
      else if (l.trim()) { flushList(); text.push(l); }
    }
    flushList(); flushText();
    return html;
  }).join("").replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

// Nouvel état de la conversation : messages redessinés s'ils ont changé, sinon seule la réponse en cours.
function applyView(v) {
  const was = CH.view;
  CH.view = v;
  $("#chatTitle").textContent = v.title;
  $("#chatHeadBtns").innerHTML = '<button class="iconbtn" data-c="rename" title="Renommer" aria-label="Renommer">' + ic("pencil") + '</button><button class="iconbtn" data-c="delete" title="Supprimer" aria-label="Supprimer">' + ic("trash") + "</button>";
  const box = $("#msgs");
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  const sig = v.messages.length + "|" + (v.messages.length && v.messages[v.messages.length - 1].at) + "|" + !!v.pending + "|" + CH.editing;
  if (sig !== CH.sig) {
    CH.sig = sig;
    let lastBoss = -1;
    v.messages.forEach((m, i) => { if (m.role === "boss") lastBoss = i; });
    box.innerHTML = v.messages.map((m, i) => msgHtml(m, i, lastBoss)).join("") + '<div id="liveBox"></div>';
    if (!v.messages.length && !v.pending) box.innerHTML = '<div class="empty" style="margin:auto">' + ic("chat") + "<div>Conversation vide.</div></div>";
  }
  const live = $("#liveBox");
  if (live) live.innerHTML = v.pending ? liveHtml(v.pending) : "";
  if (near || (was && was.messages.length !== v.messages.length) || !was) box.scrollTop = box.scrollHeight;
  const send = $("#chatSend");
  if (send) {
    send.className = "btn" + (v.pending ? " stop" : "");
    send.innerHTML = v.pending ? ic("stop") + (v.pending.stopping ? "Arrêt…" : "Arrêter") : ic("send") + "Envoyer";
  }
  // Fin d'une réponse : liste des conversations et barre latérale à jour (agents réglés ou lancés).
  if (was && was.pending && !v.pending) { refreshList(); pollNav(); }
  schedule(v.pending ? 800 : 15000);
}
function schedule(ms) { clearTimeout(chatTimer); chatTimer = setTimeout(tickChat, ms); }
async function tickChat() {
  if (!location.hash.startsWith("#/p/" + CH.pid + "/chat")) return;
  try {
    if (CH.cid && CH.cid !== "new" && CH.cid !== "notifs" && CH.editing === null) applyView(await call(chatApi("/chats/" + CH.cid)));
    else schedule(15000);
    if (Date.now() - CH.listAt > 15000) refreshList();
  } catch (e) { schedule(5000); }
}
async function refreshList() {
  try {
    const d = await call(chatApi("/chats") + (CH.q ? "?q=" + encodeURIComponent(CH.q) : ""));
    CH.list = d.conversations; CH.listAt = Date.now();
    const q = $("#convQ"), focused = q && document.activeElement === q, pos = q && q.selectionStart;
    $("#convs").innerHTML = convListHtml();
    if (focused) { const n = $("#convQ"); n.focus(); n.setSelectionRange(pos, pos); }

// ---------- actions de la page ----------
function wireChat() {
  $("#convs").addEventListener("click", async (e) => {
    const el = e.target.closest("[data-c]");
    if (!el) return;
    document.body.classList.remove("convs-open");
    if (el.dataset.c === "new") return openConv("new");
    openConv(el.dataset.c);
  });
  let qt = null;
  $("#convs").addEventListener("input", (e) => { if (e.target.id !== "convQ") return; CH.q = e.target.value; clearTimeout(qt); qt = setTimeout(refreshList, 250); });
  $("#chatSec").addEventListener("click", async (e) => {
    const c = e.target.closest(".chathead [data-c]");
    if (c && c.dataset.c === "toggle") return document.body.classList.toggle("convs-open");
    if (c && c.dataset.c === "rename") {
      const t = await modal({ title: "Renommer la conversation", input: { value: CH.view.title, rows: 1, min: 1 }, ok: "Renommer" });
      if (t) try { applyView(await call(chatApi("/chats/" + CH.cid + "/rename"), { title: t })); refreshList(); } catch (x) { toast(x.message, "err"); }
      return;
    }
    if (c && c.dataset.c === "delete") {
      if (!(await modal({ title: "Supprimer « " + CH.view.title + " » ?", body: "La conversation et ses pièces jointes sont effacées. Ce que le patron a déjà fait reste fait.", ok: "Supprimer", danger: true }))) return;
      try { await call(chatApi("/chats/" + CH.cid + "/delete"), {}); await refreshList(); openConv(CH.list.length ? CH.list[0].id : "new"); } catch (x) { toast(x.message, "err"); }
      return;
    }
    const b = e.target.closest("[data-t]");
    if (!b) return;
    const [act, n] = b.dataset.t.split(":"), i = Number(n);
    const msgs = (CH.view && CH.view.messages) || [];
    if (act === "sugg") { $("#chatIn").value = b.textContent; return sendChat(); }
    if (act === "copy") return navigator.clipboard.writeText(msgs[i].text).then(() => toast("Copié", "ok"), () => toast("Copie impossible", "err"));
    if (act === "edit") { CH.editing = i; applyView(CH.view); const t = $("#editIn"); t.focus(); t.setSelectionRange(t.value.length, t.value.length); return; }
    if (act === "noedit") { CH.editing = null; return applyView(CH.view); }
    if (act === "sendedit") return rewind(i, $("#editIn").value.trim());
    if (act === "redo") { let u = i; while (u >= 0 && msgs[u].role !== "user") u--; if (u >= 0) return rewind(u); return; }
    if (act === "ask") { const m = CH.notes[i]; CH.draft = "À propos de cette notification (" + when(m.at) + ") : « " + m.text.split("\n")[0].slice(0, 160) + " »\n"; return openConv("new"); }
  });
  // Glisser-déposer des fichiers sur la conversation.
  const sec = $("#chatSec");
  sec.addEventListener("dragover", (e) => { if (CH.cid === "notifs" || ![...e.dataTransfer.types].includes("Files")) return; e.preventDefault(); sec.classList.add("dropping"); });
  sec.addEventListener("dragleave", (e) => { if (!sec.contains(e.relatedTarget)) sec.classList.remove("dropping"); });
  sec.addEventListener("drop", (e) => { sec.classList.remove("dropping"); if (CH.cid === "notifs" || !e.dataTransfer.files.length) return; e.preventDefault(); addFiles(e.dataTransfer.files); });
}
function wireComposer() {
  const inp = $("#chatIn");
  const size = () => { inp.style.height = "auto"; inp.style.height = Math.min(180, inp.scrollHeight + 2) + "px"; };
  inp.addEventListener("input", size);
  // Entrée envoie (Maj+Entrée : nouvelle ligne) ; sur téléphone, Entrée fait une nouvelle ligne et on touche Envoyer.
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); sendChat(); } });
  // Coller une capture d'écran.
  inp.addEventListener("paste", (e) => { const f = [...(e.clipboardData || {}).items || []].filter((x) => x.kind === "file").map((x) => x.getAsFile()).filter(Boolean); if (f.length) { e.preventDefault(); addFiles(f); } });
  $("#chatSend").addEventListener("click", () => (CH.view && CH.view.pending ? stopChat() : sendChat()));
  $("#attBtn").addEventListener("click", () => $("#attIn").click());
  $("#attIn").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
  $("#atts").addEventListener("click", (e) => { const b = e.target.closest("[data-rm]"); if (b) { CH.files.splice(Number(b.dataset.rm), 1); drawAtts(); } });
}
async function addFiles(list) {
  for (const f of [...list]) {
    if (CH.files.length >= 5) { toast("5 fichiers au plus par message", "err"); break; }
    if (f.size > 6 * 1024 * 1024) { toast((f.name || "Fichier") + " : 6 Mo au plus", "err"); continue; }
    const name = f.name && f.name !== "image.png" ? f.name : "capture-" + new Date().toISOString().slice(11, 19).replace(/:/g, "") + "." + ((f.type || "image/png").split("/")[1] || "png");
    if (!/\.(png|jpe?g|gif|webp|pdf|txt|log|csv|json|md)$/i.test(name)) { toast(name + " : type non accepté", "err"); continue; }
    const data = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(f); });
    CH.files.push({ name, type: f.type, size: f.size, data });
  }
  drawAtts();
}
function drawAtts() {
  const box = $("#atts");
  if (box) box.innerHTML = CH.files.map((f, i) => '<span class="attc">' + (/^image\//.test(f.type) ? '<img src="' + f.data + '" alt="">' : ic("file")) + "<span>" + esc(f.name) + '</span><button data-rm="' + i + '" aria-label="Retirer">' + ic("x") + "</button></span>").join("");
}
async function sendChat() {
  const inp = $("#chatIn"), text = inp.value.trim();
  if ((!text && !CH.files.length) || (CH.view && CH.view.pending)) return;
  const btn = $("#chatSend");
  btn.disabled = true;
  try {
    let cid = CH.cid;
    if (cid === "new") cid = (await call(chatApi("/chats"), {})).id;
    const v = await call(chatApi("/chats/" + cid + "/messages"), { text, files: CH.files.map((f) => ({ name: f.name, data: f.data })) });
    inp.value = ""; inp.style.height = "auto"; CH.files = []; drawAtts();
    if (cid !== CH.cid) { CH.cid = cid; history.replaceState(null, "", "#/p/" + CH.pid + "/chat/" + cid); currentHash = location.hash; CH.sig = ""; }
    applyView(v);
    refreshList();
  } catch (e) { toast(e.message, "err"); }
  btn.disabled = false;
}
async function stopChat() { try { applyView(await call(chatApi("/chats/" + CH.cid + "/stop"), {})); } catch (e) { toast(e.message, "err"); } }
async function rewind(index, text) {
  CH.editing = null;
  try { applyView(await call(chatApi("/chats/" + CH.cid + "/rewind"), { index, text })); refreshList(); } catch (e) { toast(e.message, "err"); applyView(CH.view); }
}

// WebAuthn : options du serveur (base64url) <-> objets du navigateur (ArrayBuffer).
const b64uBuf = (s) => Uint8Array.from(atob(String(s).replace(/-/g, "+").replace(/_/g, "/") + "===".slice((String(s).length + 3) % 4)), (c) => c.charCodeAt(0)).buffer;
const bufB64u = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const pkGetOpts = (pk) => ({ ...pk, challenge: b64uBuf(pk.challenge), allowCredentials: (pk.allowCredentials || []).map((c) => ({ ...c, id: b64uBuf(c.id) })) });
const pkCreateOpts = (pk) => ({ ...pk, challenge: b64uBuf(pk.challenge), user: { ...pk.user, id: b64uBuf(pk.user.id) }, excludeCredentials: (pk.excludeCredentials || []).map((c) => ({ ...c, id: b64uBuf(c.id) })) });
function credJson(c) {
  const r = c.response;
  return { id: c.id, type: c.type, response: { clientDataJSON: bufB64u(r.clientDataJSON), ...(r.attestationObject ? { attestationObject: bufB64u(r.attestationObject) } : {}),
    ...(r.authenticatorData ? { authenticatorData: bufB64u(r.authenticatorData), signature: bufB64u(r.signature) } : {}) } };
}

  return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"; s.onload = () => ok(window.qrcode); s.onerror = ko; document.head.appendChild(s); });
}

  '<div class="mono" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;margin:10px 0;font-size:14px">' + codes.map((c) => "<span>" + esc(c) + "</span>").join("") + "</div>" +

// Demande du mot de passe avant une action sensible (retirer un facteur, nouveaux codes).
function askPassword(title) {
  return new Promise((resolve) => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = '<form class="modal"><h3>' + esc(title) + '</h3><div class="small muted">Confirme avec ton mot de passe.</div><input class="i" type="password" autocomplete="current-password" required style="margin-top:12px">' +
      '<div class="actions" style="justify-content:flex-end"><button class="btn sec" type="button" data-x="0">Annuler</button><button class="btn" type="submit">Confirmer</button></div></form>';
    const done = (v) => { bg.remove(); resolve(v); };
    bg.addEventListener("click", (e) => { if (e.target === bg || e.target.closest("[data-x]")) done(null); });
    bg.querySelector("form").addEventListener("submit", (e) => { e.preventDefault(); done(bg.querySelector("input").value); });
    document.body.appendChild(bg);
    bg.querySelector("input").focus();
  });
}

function pickerHtml(id, items, cur) {
  const c = items.find((x) => x.v === cur) || items[0];
  return '<div class="picker" id="' + id + '"><button type="button" aria-haspopup="listbox" aria-expanded="false"><span class="ico">' + ic(c.icon) + '</span><span class="nm">' + esc(c.label) + "</span>" + ic("chev", "chev") + "</button>" +
    '<div class="menu" role="listbox">' + items.map((x) => '<button type="button" role="option" data-v="' + esc(x.v) + '"' + (x.v === c.v ? ' class="on" aria-selected="true"' : "") + ">" + ic(x.icon) +
      '<span class="nm">' + esc(x.label) + "</span>" + (x.sub ? '<span class="sub">' + esc(x.sub) + "</span>" : "") + (x.v === c.v ? ic("tick", "tick") : "") + "</button>").join("") + "</div></div>";
}
function wirePicker(id, onPick) {
  const el = $("#" + id);
  if (!el) return;
  const btn = el.querySelector(":scope > button"), opts = () => [...el.querySelectorAll(".menu button")];
  const close = () => { el.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); document.removeEventListener("click", outside, true); document.removeEventListener("keydown", key); };
  const outside = (e) => { if (!el.contains(e.target)) close(); };
  const key = (e) => {
    if (e.key === "Escape") { e.preventDefault(); close(); btn.focus(); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const l = opts(), i = l.indexOf(document.activeElement); l[(i + (e.key === "ArrowDown" ? 1 : l.length - 1)) % l.length].focus(); }
  };
  btn.addEventListener("click", () => {
    if (el.classList.contains("open")) return close();
    el.classList.add("open"); btn.setAttribute("aria-expanded", "true");
    document.addEventListener("click", outside, true); document.addEventListener("keydown", key);
    (el.querySelector(".menu .on") || opts()[0]).focus();
  });
  el.querySelector(".menu").addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (b) { close(); onPick(b.dataset.v); } });
}

      await pageApi();
      $("#keyBox").innerHTML = '<div class="note" style="margin-top:10px"><b>Ta nouvelle clé</b> : copie-la maintenant dans le projet extérieur (variable d\'environnement, coffre de secrets). <b>Elle ne sera plus affichée.</b><div class="mono" style="margin:10px 0;font-size:14px;word-break:break-all">' + esc(r.secret) + '</div><button class="btn sec sm" id="copyKey">' + ic("copy") + "Copier la clé</button></div>";
      $("#copyKey").addEventListener("click", () => navigator.clipboard.writeText(r.secret).then(() => toast("Clé copiée", "ok")));
    } catch (x) { bg.querySelector("#kErr").textContent = x.message; }
  });
  document.body.appendChild(bg);
  bg.querySelector("input").focus();
}
function connForm() {
  $("#connForm").innerHTML = '<form id="cxF" class="note" style="margin-top:10px">' +
    '<div class="row wrapf" style="gap:12px"><div class="grow" style="min-width:180px"><label class="f" style="margin-top:0">Nom</label><input class="i" name="name" maxlength="30" placeholder="scanner-cve" required></div>' +
    '<div class="grow" style="min-width:220px"><label class="f" style="margin-top:0">À quoi elle sert (lu par les agents)</label><input class="i" name="description" maxlength="300" placeholder="Scanner de vulnérabilités : serveurs, CVE, correctifs"></div></div>' +
    '<div class="row wrapf" style="gap:12px"><div class="grow" style="min-width:220px"><label class="f">Adresse de l\'API</label><input class="i" name="baseUrl" placeholder="https://scanner.exemple.fr" required></div>' +
    '<div style="min-width:180px"><label class="f">Chemins permis (début)</label><input class="i" name="prefix" value="/api/" placeholder="/api/v1/agent/"></div></div>' +
    '<div class="row wrapf" style="gap:12px;align-items:flex-start"><div style="min-width:160px"><label class="f">En-tête</label><input class="i" name="header" value="Authorization"></div>' +
    '<div class="grow" style="min-width:220px">' + tokenFields() + "</div></div>" +
    '<label class="chk" style="margin-top:14px"><input type="checkbox" name="write"><span><b>Autoriser aussi l\'écriture (POST)</b><span class="d">Sinon lecture seule : les agents peuvent seulement lire cette API.</span></span></label>' +
    '<div class="actions"><button class="btn" type="submit">Enregistrer</button><button class="btn sec" type="button" data-api="cancelconn">Annuler</button></div></form>';
  wireToken($("#cxF"));
  $("#cxF").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      await call("/api/projects/" + apiProj + "/connections", { name: f.get("name"), description: f.get("description"), baseUrl: f.get("baseUrl"), prefix: f.get("prefix"), header: f.get("header"), token: f.get("token"), bearer: !!f.get("bearer"), methods: f.get("write") ? ["GET", "POST"] : ["GET"] });
      toast("Connexion ajoutée", "ok");
      pageApi();
    } catch (x) { toast(x.message, "err"); }
  });
  $("#cxF").querySelector("input").focus();
}
// Champ du jeton (nouvelle connexion, nouveau jeton). 02/11 : avec « Bearer … » en exemple dans un champ masqué, on
// tapait « Bearer » à la main, le collage ratait et rien ne le montrait. Maintenant : on colle le jeton seul, « Bearer »
// est ajouté devant (case cochée), « Afficher » permet de vérifier, et la longueur collée s'affiche.
const tokenFields = () => '<label class="f">Jeton</label><div class="row" style="gap:6px"><input class="i grow" name="token" type="password" autocomplete="off" spellcheck="false" placeholder="colle ici le jeton (ex. scan_…)">' +
  '<button class="btn sec sm" type="button" data-tk="show">Afficher</button></div><div class="small dim" data-tk="len">Rien de collé pour l\'instant.</div>' +
  '<label class="chk" style="margin-top:8px"><input type="checkbox" name="bearer" checked><span><b>Ajouter « Bearer » devant</b><span class="d">Pour l\'en-tête Authorization, le plus courant. Ne change rien si tu l\'as déjà collé avec.</span></span></label>';
function wireToken(form) {
  const i = form.querySelector('[name="token"]'), len = form.querySelector('[data-tk="len"]');
  form.querySelector('[data-tk="show"]').addEventListener("click", (e) => { const on = i.type === "password"; i.type = on ? "text" : "password"; e.target.textContent = on ? "Masquer" : "Afficher"; });
  i.addEventListener("input", () => {
    const v = i.value.trim();
    len.style.color = /^(bearer|basic|token)$/i.test(v) ? "var(--red)" : "";
    len.textContent = !v ? "Rien de collé pour l'instant." : /^(bearer|basic|token)$/i.test(v) ? "Il manque le jeton : colle-le en entier (« Bearer » est ajouté tout seul)." : v.length + " caractères collés.";
  });
}
// Modifier une connexion sans la retirer (03/11). Nouvelle adresse ou nouvel en-tête : jeton à recoller.
function connEditForm(c) {
  if (!c) return;
  const box = $("#tk-" + c.id);
  box.innerHTML = '<form class="note" style="margin-top:8px"><label class="f" style="margin-top:0">À quoi elle sert (lu par les agents)</label><input class="i" name="description" maxlength="300" value="' + esc(c.description || "") + '">' +
    '<div class="row wrapf" style="gap:12px"><div class="grow" style="min-width:200px"><label class="f">Adresse de l\'API</label><input class="i" name="baseUrl" value="' + esc(c.baseUrl) + '" required></div>' +
    '<div style="min-width:160px"><label class="f">Chemins permis (début)</label><input class="i" name="prefix" value="' + esc(c.prefix) + '"></div><div style="min-width:140px"><label class="f">En-tête</label><input class="i" name="header" value="' + esc(c.header) + '"></div></div>' +
    '<label class="chk" style="margin-top:14px"><input type="checkbox" name="write"' + (c.methods.some((m) => m !== "GET") ? " checked" : "") + '><span><b>Autoriser aussi l\'écriture (POST)</b><span class="d">Sinon lecture seule : les agents peuvent seulement lire cette API.</span></span></label>' +
    '<details style="margin-top:10px"><summary>Remplacer aussi le jeton</summary>' + tokenFields() + '<div class="help">Obligatoire si tu changes l\'adresse ou l\'en-tête : le jeton actuel ne part jamais vers une autre adresse.</div></details>' +
    '<div class="actions"><button class="btn sm" type="submit">Enregistrer</button><button class="btn sec sm" type="button" data-api="tokcancel" data-id="' + esc(c.id) + '">Annuler</button></div></form>';
  const form = box.querySelector("form");
  wireToken(form);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(form);
    try {
      await call("/api/projects/" + apiProj + "/connections/" + c.id + "/edit", { description: f.get("description"), baseUrl: f.get("baseUrl"), prefix: f.get("prefix"), header: f.get("header"),
        methods: f.get("write") ? ["GET", "POST"] : ["GET"], token: f.get("token"), bearer: !!f.get("bearer") });
      toast("Connexion modifiée", "ok");
      pageApi();
    } catch (x) { toast(x.message, "err"); }
  });
  form.querySelector("input").focus();
}
function tokenForm(id) {
  const box = $("#tk-" + id);
  box.innerHTML = '<form class="note" style="margin-top:8px">' + tokenFields() + '<div class="actions"><button class="btn sm" type="submit">Enregistrer le jeton</button><button class="btn sec sm" type="button" data-api="tokcancel" data-id="' + esc(id) + '">Annuler</button></div></form>';
  const form = box.querySelector("form");
  wireToken(form);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(form);
    try {
      const r = await call("/api/projects/" + apiProj + "/connections/" + id + "/token", { token: f.get("token"), bearer: !!f.get("bearer") });
      toast("Jeton enregistré" + (r.connection && r.connection.secret ? " (" + r.connection.secret + ")" : "") + " : clique sur « Tester » pour vérifier", "ok");
      pageApi();
    } catch (x) { toast(x.message, "err"); }
  });
  form.querySelector("input").focus();
}

// Nouveau mot de passe : toutes les sessions sont fermées, on se reconnecte avec le nouveau.
function changePassword() {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = '<form class="modal"><h3>Changer le mot de passe</h3><div class="small muted">Tous tes appareils seront déconnectés : reconnecte-toi ensuite avec le nouveau mot de passe.</div>' +
    '<label class="f">Mot de passe actuel</label><input class="i" name="current" type="password" autocomplete="current-password" required>' +
    '<label class="f">Nouveau mot de passe</label><input class="i" name="password" type="password" autocomplete="new-password" minlength="8" required><div class="help">8 caractères au moins.</div>' +
    '<div class="small" id="pwErr" style="color:var(--red);min-height:18px;margin-top:8px"></div>' +
    '<div class="actions" style="justify-content:flex-end"><button class="btn sec" type="button" data-x="0">Annuler</button><button class="btn" type="submit">Changer</button></div></form>';
  bg.addEventListener("click", (e) => { if (e.target === bg || e.target.closest("[data-x]")) bg.remove(); });
  bg.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try { await call("/api/auth/password", Object.fromEntries(new FormData(e.target).entries())); bg.remove(); toast("Mot de passe changé : reconnecte-toi", "ok"); setTimeout(() => location.reload(), 1200); }
    catch (x) { bg.querySelector("#pwErr").textContent = x.message; }
  });
  document.body.appendChild(bg);
  bg.querySelector("input").focus();
}
async function logout() {
  await fetch("/api/auth/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).catch(() => {});
  location.hash = "#/";
  location.reload();
}
(async () => {
  if (/^#\/setup/.test(location.hash)) return showAuth("setup");
  try {
    const r = await fetch("/api/auth/me", { cache: "no-store" });
    if (!r.ok) return showAuth("login");
    ME = (await r.json()).user;
  } catch (e) { return showAuth("login"); }
  pollNav().then(() => render());
})();
// Tableau de bord et liste des agents rafraîchis toutes les 30 s, jamais pendant une saisie ni sur une page en cours de modification.
setInterval(async () => {
  const h = location.hash;
  // Pas sur la carte (vue par défaut d'un projet) : la sélection en cours serait perdue.
  if ((!h || h === "#/" || /^#\/p\/[^/]+\/(agents|activite|fil)$/.test(h)) && !document.activeElement.matches("input, textarea") && !document.querySelector(".modal-bg")) { refreshing = true; try { await render(true); } finally { refreshing = false; } }
}, 30000);
</script>
